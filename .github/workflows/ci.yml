name: CaCo CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        environment-file: CaCo_env.yml
        auto-activate-base: false
        activate-environment: CaCo

    - name: Cache Conda environment
      uses: actions/cache@v3
      with:
        path: ~/conda_pkgs_dir
        key: ${{ runner.os }}-conda-${{ hashFiles('CaCo_env.yml') }}
        restore-keys: |
          ${{ runner.os }}-conda-

    - name: Download database
      shell: bash -l {0}
      run: |
        python3 CaCo.py -m download

    # ---------- PRODIGAL TESTS ----------
    - name: Test Prodigal - genome groups
      shell: bash -l {0}
      run: |
        echo "Testing genome groups with Prodigal (default)"
        python3 CaCo.py -m from_nucleotides -gl tests/example/gltest.txt
        mkdir -p test_outputs/prodigal_groups
        mv allfams.tsv allsubs.tsv carboncomp_output.tsv.xz test_outputs/prodigal_groups/

    - name: Test Prodigal - pairwise contigs
      shell: bash -l {0}
      run: |
        echo "Testing pairwise contigs with Prodigal (default)"
        python3 CaCo.py -m from_nucleotides \
          -g1 tests/example/TARA_SAMEA2620259_METAG_HFKLHEHB.fa \
          -g2 tests/example/TARA_SAMN05326651_METAG_RED00102.fa
        mkdir -p test_outputs/prodigal_pairwise
        mv allfams.tsv allsubs.tsv carboncomp_output.tsv.xz test_outputs/prodigal_pairwise/

    - name: Test Prodigal - pairwise proteins
      shell: bash -l {0}
      run: |
        echo "Testing pairwise proteins with Prodigal (default)"
        python3 CaCo.py -m from_proteins \
          -g1 tests/example/TARA_SAMEA2620259_METAG_HFKLHEHB.faa \
          -g2 tests/example/TARA_SAMN05326651_METAG_RED00102.faa
        mkdir -p test_outputs/prodigal_proteins
        mv allfams.tsv allsubs.tsv carboncomp_output.tsv.xz test_outputs/prodigal_proteins/

    - name: Validate Prodigal outputs
      shell: bash -l {0}
      run: |
        echo "Validating Prodigal test outputs..."
        for test_dir in test_outputs/prodigal_groups test_outputs/prodigal_pairwise test_outputs/prodigal_proteins; do
          cd $test_dir
          unxz -c ../../tests/expected_res/carboncomp_output.tsv.xz > expected_competition.tsv
          unxz -c carboncomp_output.tsv.xz > current_competition.tsv

          sort -k1,1 allfams.tsv > sorted_actual_fams
          sort -k1,1 ../../tests/expected_res/allfams.tsv > sorted_expected_fams
          diff -u --strip-trailing-cr sorted_expected_fams sorted_actual_fams || exit 1

          sort -k1,1 allsubs.tsv > sorted_actual_subs
          sort -k1,1 ../../tests/expected_res/allsubs.tsv > sorted_expected_subs
          diff -u --strip-trailing-cr sorted_expected_subs sorted_actual_subs || exit 1

          sort -k1,1 current_competition.tsv > sorted_actual_comp
          sort -k1,1 expected_competition.tsv > sorted_expected_comp
          diff -u --strip-trailing-cr sorted_expected_comp sorted_actual_comp || exit 1

          cd ../../
        done
        echo "✅ All Prodigal validation checks passed!"

    # ---------- MATRIX INPUT TEST ----------
    - name: Test genome-by-annotation matrix mode
      shell: bash -l {0}
      run: |
        echo "Testing genome-by-annotation matrix mode..."
        rm -f allfams.tsv allsubs.tsv carboncomp_output.tsv.xz
        python3 CaCo.py -m from_matrix \
          -matrix tests/example/genome_annotations.tsv \
          --matrix-id-column genome \
          -o carboncomp_output.tsv.xz \
          -cpus 2
        mkdir -p test_outputs/matrix
        mv allfams.tsv allsubs.tsv carboncomp_output.tsv.xz test_outputs/matrix/

    - name: Validate matrix-mode outputs
      shell: bash -l {0}
      run: |
        echo "Validating matrix-mode binary conversion and RPS output..."
        cd test_outputs/matrix

        printf 'genome\tsubstrates\nG1\tacetate, xylose\nG2\tacetate, glucose\nG3\t\n' > expected_allsubs.tsv
        diff -u --strip-trailing-cr expected_allsubs.tsv allsubs.tsv

        # Count values 2, 1, and 3 must be treated as presence; zero must be absence.
        grep -F $'G1\tacetate, xylose' allsubs.tsv
        grep -F $'G2\tacetate, glucose' allsubs.tsv
        grep -Eq '^G3[[:space:]]*$' allsubs.tsv

        # Three genomes produce exactly three unique pairwise rows plus the header.
        test "$(xz -dc carboncomp_output.tsv.xz | wc -l)" -eq 4
        test "$(xz -dc carboncomp_output.tsv.xz | tail -n +2 | cut -f1-2 | sort -u | wc -l)" -eq 3
        echo "✅ Matrix-mode validation checks passed."

    # ---------- PYRODIGAL TEST ----------
    - name: Test Pyrodigal mode
      shell: bash -l {0}
      run: |
        echo "Testing Pyrodigal mode (fast backend)"
        python3 CaCo.py -m from_nucleotides --use-pyrodigal \
          -g1 tests/example/TARA_SAMEA2620259_METAG_HFKLHEHB.fa \
          -g2 tests/example/TARA_SAMN05326651_METAG_RED00102.fa
        mkdir -p test_outputs/pyrodigal
        mv allfams.tsv allsubs.tsv carboncomp_output.tsv.xz test_outputs/pyrodigal/

    - name: Validate Pyrodigal outputs
      shell: bash -l {0}
      run: |
        echo "Validating Pyrodigal outputs (should match Prodigal results)..."
        cd test_outputs/pyrodigal
        unxz -c ../../tests/expected_res/carboncomp_output.tsv.xz > expected_competition.tsv
        unxz -c carboncomp_output.tsv.xz > current_competition.tsv

        sort -k1,1 allfams.tsv > sorted_actual_fams
        sort -k1,1 ../../tests/expected_res/allfams.tsv > sorted_expected_fams
        diff -u --strip-trailing-cr sorted_expected_fams sorted_actual_fams || exit 1

        sort -k1,1 allsubs.tsv > sorted_actual_subs
        sort -k1,1 ../../tests/expected_res/allsubs.tsv > sorted_expected_subs
        diff -u --strip-trailing-cr sorted_expected_subs sorted_actual_subs || exit 1

        sort -k1,1 current_competition.tsv > sorted_actual_comp
        sort -k1,1 expected_competition.tsv > sorted_expected_comp
        diff -u --strip-trailing-cr sorted_expected_comp sorted_actual_comp || exit 1

        echo "✅ Pyrodigal outputs match expected results."

    # ---------- ADDITIONAL TESTS ----------
    - name: Test error handling - missing Prodigal
      shell: bash -l {0}
      run: |
        echo "Testing error handling when Prodigal is missing..."
        PRODIGAL_PATH=$(which prodigal)
        if [ -n "$PRODIGAL_PATH" ]; then
          mv "$PRODIGAL_PATH" "${PRODIGAL_PATH}.bak"
        fi

        set +e
        python3 CaCo.py -m from_nucleotides \
          -g1 tests/example/TARA_SAMEA2620259_METAG_HFKLHEHB.fa \
          -g2 tests/example/TARA_SAMN05326651_METAG_RED00102.fa 2>&1 | tee error_output.txt
        EXIT_CODE=$?
        set -e

        if [ -n "$PRODIGAL_PATH" ]; then
          mv "${PRODIGAL_PATH}.bak" "$PRODIGAL_PATH"
        fi

        if [ $EXIT_CODE -eq 0 ]; then
          echo "❌ Script should have failed when Prodigal is missing"
          exit 1
        fi

        if grep -q "Prodigal not found in PATH" error_output.txt; then
          echo "✅ Error handling test passed"
        else
          echo "❌ Expected 'Prodigal not found in PATH' message"
          exit 1
        fi

    - name: Test version flag
      shell: bash -l {0}
      run: |
        echo "Testing version flag..."
        python3 CaCo.py -v | grep -q "CaCo 0.2.1a" || exit 1
        echo "✅ Version flag test passed"

    - name: Upload test outputs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-outputs
        path: |
          test_outputs/
          error_output.txt
          *.tsv
          *.tsv.xz
